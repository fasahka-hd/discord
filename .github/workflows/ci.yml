name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server/index.js
      - run: node --check server/api.js
      - run: node --check server/auth.js
      - run: node --check server/db.js
      - run: node --check server/extended.js
      - run: node --check server/features.js
      - run: node --check server/permissions.js
      - run: npm run build
      - run: |
          npm run start > /tmp/dsh-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm test
