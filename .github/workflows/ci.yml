name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server/index.js
      - run: node --check server/api.js
      - run: node --check server/auth.js
      - run: node --check server/db.js
      - run: node --check server/extended.js
      - run: node --check server/features.js
      - run: node --check server/permissions.js
      - run: npm run build
      - run: npm test
